name: Pubblica il sito (indirizzo di prova su GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lanciato da Supabase/n8n quando si pubblica un articolo del Journal
  repository_dispatch:
    types: [journal-update]
  # Rete di sicurezza: ricostruzione notturna (articoli programmati)
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Indirizzo di prova: BASE_PATH=/sito e PUBLIC_STAGING=1 (variabili del repository).
          # Al lancio su flowline.it: BASE_PATH vuoto e PUBLIC_STAGING=0.
          BASE_PATH: ${{ vars.BASE_PATH || '/sito' }}
          PUBLIC_STAGING: ${{ vars.PUBLIC_STAGING || '1' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
